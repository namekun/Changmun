<title>검색엔진 바로 고르기 시안</title>
<style>
  body { margin: 0; padding: 16px; background: #E9E9E6; font: 15px/1.6 -apple-system, "Apple SD Gothic Neo", sans-serif; color: #111; }
  img { display: block; width: 100%; max-width: 760px; height: auto; margin: 16px auto 0; border-radius: 12px; }
  p, ul { max-width: 760px; margin: 16px auto 0; color: #444; }
</style>
<p>주소창(⌘L·⌘T)에 검색어를 치면 첫 줄 아래에 <b>다른 검색엔진 칩</b>이 보여요. 누르거나 <b>⌘1~⌘4</b>를 누르면 그 엔진으로 이번 한 번만 검색해요. 기본 검색엔진은 그대로예요.</p>
<ul>
  <li>칩 옆 작은 글자는 키워드예요. <b>n 돼지국밥</b>처럼 앞에 붙여 쳐도 같은 엔진으로 검색해요. 기본 엔진 네 개에도 키워드(g·n·d·b)를 새로 넣어요.</li>
  <li>설정에서 직접 추가한 검색엔진(그림의 위키백과)도 함께 나와요.</li>
  <li>테스트 화면이라 "Search with"·"Search"가 영어로 나왔는데, 앱에서는 한국어로 나와요.</li>
</ul>
