<title>즐겨찾기 소리 표시 시안</title>
<style>
  body { margin: 0; padding: 16px; background: #E9E9E6; font: 15px/1.6 -apple-system, "Apple SD Gothic Neo", sans-serif; color: #111; }
  img { display: block; width: 100%; max-width: 700px; height: auto; margin: 16px auto 0; border-radius: 12px; }
  p, ul { max-width: 700px; margin: 16px auto 0; color: #444; }
</style>
<p>즐겨찾기 타일의 소리 표시 시안이에요. 칸은 왼쪽부터 재생 중, 재생 중이면서 보고 있는 탭, 음소거예요. (아이콘이 흐린 건 저장된 작은 파비콘을 크게 키워서예요.)</p>
<ul>
  <li><b>지금:</b> 20pt 회색 버튼이 아이콘 오른쪽 위를 가려요.</li>
  <li><b>A 모서리 배지:</b> 타일 모서리의 작은 동그라미. 눌러서 음소거.</li>
  <li><b>B 아래 소리 막대:</b> 아이콘 밑의 막대 세 개가 소리에 맞춰 움직여요. 음소거면 스피커.</li>
  <li><b>C 아이콘 옆 스피커:</b> 아이콘을 왼쪽으로 조금 밀고 옆에 스피커.</li>
</ul>
